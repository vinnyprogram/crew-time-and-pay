<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Colors -- same names as the Employees dropdown in your Excel
   ============================================================ */
const COLORS = {
  Red:'#E8544A', Orange:'#F2994A', Yellow:'#D8A400', Green:'#27AE60',
  Teal:'#178A8F', Blue:'#2F80ED', Purple:'#9B51E0', Gray:'#8A887F'
};

/* ============================================================
   Google Apps Script helpers (no library needed -- plain fetch)
   GET  ?action=all             -> {employees, entries, payments}
   POST {action, ...payload}    -> {ok:true} or {error:"..."}
   NOTE: POST uses Content-Type text/plain on purpose -- this avoids
   a CORS preflight request, which Apps Script Web Apps don't handle.
   ============================================================ */
async function gasGet() {
  const res = await fetch(`${GAS_URL}?action=all`);
  if (!res.ok) throw new Error(`Sheet request failed: ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function gasPost(action, payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  if (!res.ok) throw new Error(`Sheet request failed: ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/* ============================================================
   Time math -- mirrors the Excel MOD(Finish-Start,24) formula
   ============================================================ */
// Disables a button and shows a saving label the instant it's tapped, so a
// second tap while the (slow) Apps Script request is still in flight can't
// create a duplicate row. Re-enables the button once the request finishes --
// unless the page has already moved on (e.g. render() rebuilt the DOM).
let savePending = false;

// Lets every open tab of this app, on this same device, hear about a save
// the instant another tab makes one -- so two tabs open side by side never
// drift out of sync. Purely local to the device; never leaves the browser.
const syncChannel = (typeof BroadcastChannel !== 'undefined')
  ? new BroadcastChannel('crew_time_and_pay_sync') : null;
if (syncChannel) {
  syncChannel.onmessage = () => { if (!savePending) render(); };
}

async function guardedSave(btn, savingLabel, fn) {
  if (!btn || btn.disabled) return;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = savingLabel;
  savePending = true;
  try {
    await fn();
  } finally {
    savePending = false;
    if (btn.isConnected) { btn.disabled = false; btn.textContent = original; }
    if (syncChannel) syncChannel.postMessage('refresh');
  }
}

// Call at the top of any navigation function. Returns true (and blocks the
// navigation) if a save is still being written to the sheet -- this is what
// stops someone from tapping "back" mid-save and accidentally being shown a
// stale "not clocked in yet" screen that invites a duplicate submission.
function blockedBySavePending() {
  if (savePending) {
    showToast('Aguarde, salvando\u2026', true);
    return true;
  }
  return false;
}

function hoursBetween(startHrs, finishHrs) {
  let diff = Number(finishHrs) - Number(startHrs);
  diff = ((diff % 24) + 24) % 24;
  diff = Math.max(diff - 1, 0);  // 1-hour lunch deduction, same as the Excel formula
  return Math.round(diff * 100) / 100;
}

function currentTimeDecimal() {
  const now = new Date();
  return Math.round((now.getHours() + now.getMinutes() / 60) * 100) / 100;
}

// A simple Hour : Minute dropdown picker that always shows 24h format,
// regardless of the phone's own time-format setting (unlike the native
// <input type="time">, whose display follows each device's own locale).
function timePickerHTML(idPrefix, decimalValue) {
  let h = null, m = null;
  if (decimalValue !== null && decimalValue !== undefined && decimalValue !== '') {
    h = Math.floor(Number(decimalValue));
    m = Math.round((Number(decimalValue) - h) * 60);
    m = Math.round(m / 5) * 5;
    if (m === 60) { m = 0; h = (h + 1) % 24; }
  }
  const hourOptions = (h === null ? `<option value="x" selected>--</option>` : '') +
    Array.from({ length: 24 }, (_, i) => `<option value="${i}" ${i === h ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('');
  const minOptions = (m === null ? `<option value="x" selected>--</option>` : '') +
    Array.from({ length: 12 }, (_, i) => i * 5).map(mm => `<option value="${mm}" ${mm === m ? 'selected' : ''}>${String(mm).padStart(2, '0')}</option>`).join('');
  return `
    <div style="display:flex; align-items:center; gap:8px;">
      <select id="${idPrefix}_h">${hourOptions}</select>
      <span style="font-weight:700; font-size:20px; color:var(--ink-soft);">:</span>
      <select id="${idPrefix}_m">${minOptions}</select>
    </div>`;
}

function readTimePicker(idPrefix) {
  const h = document.getElementById(`${idPrefix}_h`).value;
  const m = document.getElementById(`${idPrefix}_m`).value;
  const hNum = Number(h), mNum = Number(m);
  if (h === 'x' || m === 'x' || isNaN(hNum) || isNaN(mNum)) return NaN;
  return Math.round((hNum + mNum / 60) * 100) / 100;
}

// Turns a native time input's "HH:MM" value into our internal decimal hour (7, 17.5, ...)
function hhmmToDecimal(hhmm) {
  if (!hhmm) return NaN;
  const [h, m] = hhmm.split(':').map(Number);
  return Math.round((h + m / 60) * 100) / 100;
}

// Turns a decimal hour (7, 17.5, ...) into a readable 24h clock time (07:00, 17:30)
function formatDecimalTime(dec) {
  const h24 = Math.floor(Number(dec));
  const mins = Math.round((Number(dec) - h24) * 60);
  return `${String(h24).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
}
function money(n) {
  return '$' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

/* ============================================================
   Tiny state / router
   ============================================================ */
const state = {
  view: 'home',          // home | worker | adminGate | admin
  employees: [],
  entries: [],
  payments: [],
  expenses: [],
  expensePayments: [],
  activeEmployee: null,
  adminTab: 'employees',
  paymentFormDefaults: null,  // remembers employee + next start date after a payment save
  customReport: null,  // { empNum: 'all'|number, from, to } for the Summary tab's filtered report
  configured: GAS_URL.indexOf('YOUR-DEPLOYMENT-ID') === -1
};

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => { t.className = 'toast'; }, 2200);
}

async function loadAll() {
  const data = await gasGet();
  state.employees = (data.employees || []).map(e => ({
    ...e,
    employee_number: Number(e.employee_number),
    daily_rate: Number(e.daily_rate),
    standard_hours: Number(e.standard_hours)
  })).sort((a, b) => a.employee_number - b.employee_number);
  state.entries = (data.entries || []).map(e => ({
    ...e,
    employee_number: Number(e.employee_number),
    hours_worked: Number(e.hours_worked),
    hourly_rate: Number(e.hourly_rate),
    amount_earned: Number(e.amount_earned),
    gasolina: Number(e.gasolina || 0)
  })).sort((a, b) => (a.work_date < b.work_date ? 1 : -1));
  state.payments = (data.payments || []).map(p => ({
    ...p,
    employee_number: Number(p.employee_number),
    amount: Number(p.amount)
  })).sort((a, b) => (a.payment_date < b.payment_date ? 1 : -1));
  state.expenses = (data.expenses || []).map(x => ({
    ...x,
    qty: Number(x.qty),
    unit_cost: Number(x.unit_cost),
    total: Number(x.total)
  })).sort((a, b) => (a.date < b.date ? 1 : -1));
  state.expensePayments = (data.expensePayments || []).map(p => ({
    ...p,
    amount: Number(p.amount)
  }));
}

function expenseTotals(expenseId) {
  const paid = state.expensePayments
    .filter(p => p.expense_id === expenseId)
    .reduce((s, p) => s + Number(p.amount || 0), 0);
  return { paid };
}

function totalsFor(empNum) {
  const earned = state.entries.filter(e => e.employee_number === empNum)
    .reduce((s, e) => s + Number(e.amount_earned), 0);
  const gasAccrued = state.entries.filter(e => e.employee_number === empNum)
    .reduce((s, e) => s + Number(e.gasolina || 0), 0);

  const myPayments = state.payments.filter(p => p.employee_number === empNum);
  const wagesPaid = myPayments.reduce((s, p) => s + paymentWages(p), 0);
  const gasPaid = myPayments.reduce((s, p) => s + paymentGas(p), 0);

  return {
    earned, gasAccrued, wagesPaid, gasPaid,
    wagesBalance: earned - wagesPaid,
    gasBalance: gasAccrued - gasPaid
  };
}

// Reads a payment row's wages/gas split. Supports both the current
// one-row format (wages_amount / gas_amount) and older rows saved
// with a single "type" + "amount" field, so past data keeps working.
function paymentWages(p) {
  if (p.wages_amount !== undefined && p.wages_amount !== '') return Number(p.wages_amount) || 0;
  return (p.type !== 'Gas') ? (Number(p.amount) || 0) : 0;
}
function paymentGas(p) {
  if (p.gas_amount !== undefined && p.gas_amount !== '') return Number(p.gas_amount) || 0;
  return (p.type === 'Gas') ? (Number(p.amount) || 0) : 0;
}

function hourlyRate(emp) {
  if (!emp.standard_hours) return 0;
  return emp.daily_rate / emp.standard_hours;
}

// Pay for a day's hours, capped at the employee's agreed daily rate once
// they hit their standard hours -- working past that doesn't earn more,
// it just tops out at the flat daily amount (e.g. Julio: $350 for 9h+).
function amountForHours(hours, emp) {
  const raw = Math.round(hours * hourlyRate(emp) * 100) / 100;
  const cap = Number(emp.daily_rate) || raw;
  return Math.min(raw, cap);
}

/* ============================================================
   Local cache -- lets the app paint instantly from the last known
   data while it quietly re-fetches from the (slower) Apps Script
   backend in the background. Only affects what's shown while
   waiting; never used instead of a real save.
   ============================================================ */
const CACHE_KEY = 'crew_app_cache_v1';

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      employees: state.employees, entries: state.entries,
      payments: state.payments, expenses: state.expenses
    }));
  } catch (e) { /* storage full or unavailable -- fine, just skip caching */ }
}

/* ============================================================
   Render
   ============================================================ */
function paintCurrentView() {
  const app = document.getElementById('app');
  if (state.view === 'home') return renderHome(app);
  if (state.view === 'worker') return renderWorker(app);
  if (state.view === 'adminGate') return renderAdminGate(app);
  if (state.view === 'admin') return renderAdmin(app);
}

async function render() {
  const app = document.getElementById('app');

  if (!state.configured) {
    app.innerHTML = `
      <main style="padding-top:60px">
        <div class="card">
          <h2>One setup step left</h2>
          <p style="color:var(--ink-soft); font-size:14px; line-height:1.5;">
            Open this file and fill in <b>GAS_URL</b> near the top
            with your Apps Script Web App URL (ends in <code>/exec</code>),
            then reload this page.
          </p>
        </div>
      </main>`;
    return;
  }

  const hadDataAlready = state.employees.length > 0 || state.entries.length > 0;
  if (!hadDataAlready) {
    app.innerHTML = `
      <main style="padding-top:60px; text-align:center; color:var(--ink-soft); font-size:14px;">
        Carregando dados&hellip;
      </main>`;
  }

  try {
    await loadAll();
    saveCache();
  } catch (err) {
    if (hadDataAlready) {
      // We already have something on screen (from cache or a prior load) --
      // keep showing it rather than replacing a working view with an error.
      showToast("N\u00e3o foi poss\u00edvel atualizar \u2014 mostrando os \u00faltimos dados salvos", true);
      return paintCurrentView();
    }
    app.innerHTML = `
      <main style="padding-top:60px">
        <div class="card">
          <h2>N\u00e3o foi poss\u00edvel conectar</h2>
          <p style="color:var(--ink-soft); font-size:14px;">${err.message}</p>
          <button class="secondary" onclick="render()">Tentar novamente</button>
        </div>
      </main>`;
    return;
  }

  return paintCurrentView();
}

function renderHome(app) {
  const tiles = state.employees.map(emp => `
    <button class="tile" style="--tile-color:${COLORS[emp.color] || COLORS.Gray}"
      onclick="openWorker(${emp.employee_number})">
      <div class="name">${escapeHtml(emp.name)}</div>
      <div class="rate">${money(hourlyRate(emp))}/hora</div>
    </button>
  `).join('');

  app.innerHTML = `
    <header class="top">
      <h1>Ponto da Equipe</h1>
      <div class="sub">Toque no seu nome para registrar suas horas</div>
    </header>
    <main>
      <div class="grid">
        ${tiles || ''}
      </div>
      ${state.employees.length === 0 ? `<div class="empty">Nenhum funcion\u00e1rio ainda. Adicione pelo Admin.</div>` : ''}
      <div class="admin-link" onclick="goAdminGate()">Admin</div>
    </main>
  `;
}

function openWorker(empNum) {
  if (blockedBySavePending()) return;
  state.activeEmployee = empNum;
  state.view = 'worker';
  paintCurrentView();
}

function renderWorker(app) {
  const emp = state.employees.find(e => e.employee_number === state.activeEmployee);
  if (!emp) { state.view = 'home'; return renderHome(app); }
  const sixDaysAgo = new Date();
  sixDaysAgo.setDate(sixDaysAgo.getDate() - 6);
  const cutoff = sixDaysAgo.toISOString().slice(0, 10);
  const recent = state.entries
    .filter(e => e.employee_number === emp.employee_number && e.work_date >= cutoff);

  const openEntry = state.entries.find(e =>
    e.employee_number === emp.employee_number && e.id &&
    (e.finish_time === '' || e.finish_time === undefined || e.finish_time === null)
  );
  const todayDone = state.entries.find(e =>
    e.employee_number === emp.employee_number && e.work_date === todayStr() &&
    e.finish_time !== '' && e.finish_time !== undefined && e.finish_time !== null
  );

  app.innerHTML = `
    <header class="top">

// Finds an existing entry for this employee/date whose time range overlaps
// the proposed new one. Pass newFinish as null for a Clock In (finish not
// known yet) -- then it just checks whether newStart falls inside an
// existing range. An entry with no finish_time (still open) is treated as
// running until end of day for this check.
function findOverlappingEntry(empNum, date, newStart, newFinish) {
  const sameDay = state.entries.filter(e => e.employee_number === empNum && e.work_date === date);
  for (const e of sameDay) {
    const eStart = Number(e.start_time);
    const eEnd = (e.finish_time === '' || e.finish_time === undefined || e.finish_time === null) ? 24 : Number(e.finish_time);
    if (newFinish === null || newFinish === undefined) {
      if (newStart >= eStart && newStart < eEnd) return e;
    } else {
      if (newStart < eEnd && eStart < newFinish) return e;
    }
  }
  return null;
}

function describeEntry(e) {
  return e.finish_time
    ? `${e.start_time}\u2013${e.finish_time} (${e.hours_worked}h, ${money(e.amount_earned)})`
    : `iniciado \u00e0s ${formatDecimalTime(e.start_time)}, ainda em aberto`;
}

async function clockIn(btn, empNum) {
  const emp = state.employees.find(e => e.employee_number === empNum);
  const startTime = readTimePicker('ci_start');
  if (isNaN(startTime)) { showToast('Informe o hor\u00e1rio de in\u00edcio', true); return; }

  const conflict = findOverlappingEntry(empNum, todayStr(), startTime, null);
  if (conflict) {
    alert(`J\u00e1 existe um registro nesse hor\u00e1rio para hoje: ${describeEntry(conflict)}.\n\nEscolha outro hor\u00e1rio para registrar este dia.`);
    return;
  }

  await guardedSave(btn, 'Salvando\u2026', async () => {
    try {
      await gasPost('addEntry', {
        entry: {
          employee_number: empNum, work_date: todayStr(), start_time: startTime, finish_time: '',
          hours_worked: '', hourly_rate: hourlyRate(emp), amount_earned: '', gasolina: 0, notes: ''
        }
      });
      showToast(`Ponto de entrada \u00e0s ${formatDecimalTime(startTime)}`);
      render();
    } catch (err) { showToast(err.message, true); }
  });
}

async function clockOut(btn, id, empNum) {
  const emp = state.employees.find(e => e.employee_number === empNum);
  const openEntry = state.entries.find(e => e.id === id);
  if (!openEntry) { showToast('N\u00e3o foi poss\u00edvel encontrar esse ponto de entrada', true); return; }
  const finishTime = readTimePicker('co_finish');
  if (isNaN(finishTime)) { showToast('Informe o hor\u00e1rio de sa\u00edda', true); return; }
  const hours = hoursBetween(openEntry.start_time, finishTime);
  const rate = hourlyRate(emp);
  const amount = amountForHours(hours, emp);
  await guardedSave(btn, 'Salvando\u2026', async () => {
    try {
      await gasPost('updateEntry', { id, patch: { finish_time: finishTime, hours_worked: hours, amount_earned: amount } });
      showToast(`Ponto de sa\u00edda: ${hours}h, ${money(amount)}`);
      render();
    } catch (err) { showToast(err.message, true); }
  });
}

async function submitEntry(btn, empNum) {
  const emp = state.employees.find(e => e.employee_number === empNum);
  const date = document.getElementById('f_date').value;
  const notes = document.getElementById('f_notes').value || '';
  const start = readTimePicker('f_start');
  const finish = readTimePicker('f_finish');

  if (!date || isNaN(start) || isNaN(finish)) { showToast('Preencha data, hor\u00e1rio de in\u00edcio e sa\u00edda', true); return; }

  const conflict = findOverlappingEntry(empNum, date, start, finish);
  if (conflict) {
    alert(`J\u00e1 existe um registro nesse hor\u00e1rio em ${fmtDate(date)}: ${describeEntry(conflict)}.\n\nEscolha outro hor\u00e1rio para registrar este dia.`);
    return;
  }

  const hours = hoursBetween(start, finish);
  const rate = hourlyRate(emp);
  const amount = amountForHours(hours, emp);

  await guardedSave(btn, 'Salvando\u2026', async () => {
    try {
      await gasPost('addEntry', {
        entry: {
          employee_number: empNum, work_date: date, start_time: start, finish_time: finish,
          hours_worked: hours, hourly_rate: rate, amount_earned: amount, gasolina: 0, notes
        }
      });
      showToast(`Salvo: ${hours}h, ${money(amount)}`);
      document.getElementById('f_date').value = todayStr();
      document.getElementById('f_notes').value = '';
      render();
    } catch (err) {
      showToast(err.message, true);
    }
  });
}

        return `<div class="entry">

function recalcPaymentRange() {
  const empNum = parseInt(document.getElementById('p_emp').value, 10);
  const from = document.getElementById('p_from').value;
  const to = document.getElementById('p_to').value;
  const breakdownEl = document.getElementById('p_breakdown');
  if (!from || !to) return;

  const inRange = state.entries.filter(e =>
    e.employee_number === empNum && e.work_date >= from && e.work_date <= to
  ).sort((a, b) => (a.work_date < b.work_date ? -1 : 1));

  const wagesTotal = inRange.reduce((s, e) => s + Number(e.amount_earned || 0), 0);
  document.getElementById('p_wages').value = wagesTotal ? (Math.round(wagesTotal * 100) / 100) : '';
  // Gas amount is entered manually by you (e.g. a flat weekly $70) -- not auto-calculated,
  // since gas is no longer tied to any specific day's hours.

  if (!inRange.length) {
    breakdownEl.innerHTML = 'No logged entries in this range for this employee.';
  } else {
    breakdownEl.innerHTML = 'Days included: ' + inRange.map(e => {
      const label = Number(e.hours_worked) > 0 ? fmtDate(e.work_date) : `${fmtDate(e.work_date)} \u2013 ${escapeHtml(e.notes || 'job')}`;
      return `${label} (${money(e.amount_earned)})`;
    }).join(', ');
  }
  updatePaymentTotal();
}

function updatePaymentTotal() {
  const wages = parseFloat(document.getElementById('p_wages').value) || 0;
  const gas = parseFloat(document.getElementById('p_gas').value) || 0;
  document.getElementById('p_total').textContent = money(wages + gas);
}

async function submitPayment(btn) {
  const empNum = parseInt(document.getElementById('p_emp').value, 10);
  const from = document.getElementById('p_from').value;
  const to = document.getElementById('p_to').value;
  const date = document.getElementById('p_date').value;
  const wages = parseFloat(document.getElementById('p_wages').value) || 0;
  const gas = parseFloat(document.getElementById('p_gas').value) || 0;

  if (!date || (!wages && !gas)) { showToast('Fill in a date and at least one amount', true); return; }

  await guardedSave(btn, 'Saving\u2026', async () => {
    try {
      await gasPost('addPayment', {
        payment: {
          employee_number: empNum, payment_date: date,
          wages_amount: wages, gas_amount: gas,
          covers_from: from, covers_to: to
        }
      });
      showToast(`Saved: ${money(wages + gas)} total`);
      state.paymentFormDefaults = { empNum, from: addOneDay(to), to: todayStr() };
      render();
    } catch (err) { showToast(err.message, true); }
  });
}

function addOneDay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}

                ? `<a href="${x.receipt_url}" target="_blank" rel="noopener" style="color:var(--steel); font-weight:600; font-size:12.5px;">View receipt</a>`
                : (x.id
                    ? `<input type="file" accept="image/*,application/pdf" capture="environment" style="display:none" id="receipt_${x.id}" onchange="attachReceiptToExpense('${x.id}', this.files[0])">
                       <button class="small" onclick="document.getElementById('receipt_${x.id}').click()">+ Receipt</button>`
                    : `<span style="font-size:11.5px; color:var(--ink-soft);">No receipt (older entry)</span>`)
              }
              ${needsTracking && x.id && balance > 0 ? `<button class="small" onclick="togglePayExpense('${x.id}')">+ Payment</button>` : ''}
            </div>
            ${x.id ? `
            <div id="payform_${x.id}" style="display:none; margin-top:8px; padding:10px; background:#F7F5F0; border-radius:8px;">
              <input type="date" id="pay_date_${x.id}" value="${todayStr()}" style="margin-bottom:6px;">
              <input type="number" id="pay_amt_${x.id}" inputmode="decimal" step="0.01" placeholder="Amount" value="${balance ? (Math.round(balance*100)/100) : ''}" style="margin-bottom:6px;">
              <button class="small" onclick="submitExpensePayment(this, '${x.id}')">Save payment</button>
            </div>` : ''}
          </div>
          <div class="amt">${money(x.total)}</div>
        </div>
      `; }).join('') || `<div class="empty">No expenses logged yet</div>`}
    </div>
  `;
}

function toggleDownpayment() {
  const status = document.getElementById('x_status').value;
  const wrap = document.getElementById('downpaymentWrap');
  if (wrap) wrap.style.display = status === 'Partial' ? 'block' : 'none';
}

async function submitExpense(btn) {
  const date = document.getElementById('x_date').value;
  const category = document.getElementById('x_category').value;
  const description = document.getElementById('x_desc').value;
  const vendor = document.getElementById('x_vendor').value;
  const qty = parseFloat(document.getElementById('x_qty').value) || 0;
  const unit_cost = parseFloat(document.getElementById('x_unit').value) || 0;
  const payment_status = document.getElementById('x_status').value;
  const notes = document.getElementById('x_notes').value || '';
  const receiptFile = document.getElementById('x_receipt').files[0];
  const downDate = document.getElementById('x_downdate') ? document.getElementById('x_downdate').value : '';
  const downAmt = document.getElementById('x_downamt') ? (parseFloat(document.getElementById('x_downamt').value) || 0) : 0;

  if (!date || !description || !unit_cost) { showToast('Fill in date, description and unit cost', true); return; }

  // Payment date is derived, not asked for separately: same day as the expense
  // if marked Paid, the down-payment date if Partial, or blank if Unpaid.
  const payment_date = payment_status === 'Paid' ? date : (payment_status === 'Partial' && downAmt > 0 ? downDate : '');

  const total = Math.round(qty * unit_cost * 100) / 100;
  const expense = { date, category, description, vendor, qty, unit_cost, total, payment_status, payment_date, notes };

  await guardedSave(btn, 'Saving\u2026', async () => {
    try {
      if (receiptFile) {
        if (receiptFile.size > 15 * 1024 * 1024) { showToast('Receipt file is too large (max 15MB)', true); return; }
        showToast('Uploading receipt\u2026');
        expense.receipt_name = receiptFile.name;
        expense.receipt_type = receiptFile.type || 'application/octet-stream';
        expense.receipt_data = receiptFile.type.startsWith('image/')
          ? await compressImageToDataURL(receiptFile, 1400, 0.72)
          : await fileToDataURL(receiptFile);
      }
      const result = await gasPost('addExpense', { expense });
      if (payment_status === 'Partial' && downAmt > 0 && result && result.id) {
        await gasPost('addExpensePayment', { payment: { expense_id: result.id, payment_date: downDate || todayStr(), amount: downAmt } });
        if (downAmt >= total - 0.005) {
          try { await gasPost('updateExpense', { id: result.id, patch: { payment_status: 'Paid' } }); } catch (err) { /* non-critical */ }
        }
      }
      showToast(downAmt > 0 ? `Saved: ${money(total)} (down payment ${money(downAmt)} recorded)` : `Saved: ${money(total)}`);
      render();
    } catch (err) { showToast(err.message, true); }
  });
}

async function attachReceiptToExpense(id, file) {
  if (!file) return;
  if (file.size > 15 * 1024 * 1024) { showToast('Receipt file is too large (max 15MB)', true); return; }
  try {
    showToast('Uploading receipt\u2026');
    const receipt_data = file.type.startsWith('image/')
      ? await compressImageToDataURL(file, 1400, 0.72)
      : await fileToDataURL(file);
    await gasPost('attachReceipt', { id, receipt_data, receipt_type: file.type || 'application/octet-stream', receipt_name: file.name });
    showToast('Receipt attached');
    render();
  } catch (err) { showToast(err.message, true); }
}

function togglePayExpense(id) {
  const el = document.getElementById(`payform_${id}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function submitExpensePayment(btn, id) {
  const date = document.getElementById(`pay_date_${id}`).value;
  const amount = parseFloat(document.getElementById(`pay_amt_${id}`).value) || 0;
  if (!date || !amount) { showToast('Fill in a date and amount', true); return; }
  await guardedSave(btn, 'Saving\u2026', async () => {
    try {
      await gasPost('addExpensePayment', { payment: { expense_id: id, payment_date: date, amount } });
      const newTotalPaid = expenseTotals(id).paid + amount;  // state's paid-so-far, plus this payment
      await maybeMarkExpensePaid(id, newTotalPaid);
      showToast(`Payment saved: ${money(amount)}`);
      render();
    } catch (err) { showToast(err.message, true); }
  });
}

// Once an expense's payments add up to its full total, flip its status to
// Paid automatically -- so it stops showing as "owed" and matches reality.
async function maybeMarkExpensePaid(id, totalPaidSoFar) {
  const exp = state.expenses.find(x => x.id === id);
  if (exp && exp.payment_status !== 'Paid' && totalPaidSoFar >= exp.total - 0.005) {
    try { await gasPost('updateExpense', { id, patch: { payment_status: 'Paid' } }); } catch (err) { /* non-critical -- ignore */ }
  }
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Shrinks a photo before upload so it goes through the (slow) Apps Script
// backend quickly instead of sending a multi-megabyte camera image as-is.
function compressImageToDataURL(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function generateCustomReport() {
  const empVal = document.getElementById('cr_emp').value;
  const from = document.getElementById('cr_from').value;
  const to = document.getElementById('cr_to').value;
  if (!from || !to) { showToast('Pick a from and to date', true); return; }
  state.customReport = { empNum: empVal === 'all' ? 'all' : parseInt(empVal, 10), from, to };
  render();
}

function clearCustomReport() {
  state.customReport = null;
  render();
}

// Allocates an employee's total wages paid (all-time) against their earnings
// oldest-day-first, so we can tell exactly which specific days are still
// unpaid -- not just a lump "total owed" figure.
function computePaymentAllocation(empNum) {
  const entries = state.entries.filter(e => e.employee_number === empNum)
    .slice().sort((a, b) => (a.work_date < b.work_date ? -1 : 1));
  let pool = state.payments.filter(p => p.employee_number === empNum)
    .reduce((s, p) => s + paymentWages(p), 0);

  return entries.map(e => {
    const amt = Number(e.amount_earned) || 0;
    let status, paidAmt, owedAmt;
    if (pool >= amt - 0.005) { status = 'Paid'; paidAmt = amt; owedAmt = 0; pool -= amt; }
    else if (pool > 0.005) { status = 'Partial'; paidAmt = pool; owedAmt = amt - pool; pool = 0; }
    else { status = 'Unpaid'; paidAmt = 0; owedAmt = amt; }
    return { ...e, status, paidAmt, owedAmt };
  });
}

function renderCustomReportSection(cr) {
  const inRange = e => e.work_date >= cr.from && e.work_date <= cr.to;
  const rangeLabel = `${fmtDate(cr.from)} \u2013 ${fmtDate(cr.to)}`;

  if (cr.empNum === 'all') {
    const rows = state.employees.map(emp => {
      const entries = state.entries.filter(e => e.employee_number === emp.employee_number && inRange(e));
      const hours = entries.reduce((s, e) => s + Number(e.hours_worked || 0), 0);
      const earned = entries.reduce((s, e) => s + Number(e.amount_earned || 0), 0);
      return `<tr><td>${escapeHtml(emp.name)}</td><td>${hours}</td><td>${money(earned)}</td></tr>`;
    }).join('');
    return `
      <div class="card" style="overflow-x:auto">
        <h2>Custom Report: All Employees</h2>
        <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;">${rangeLabel}</div>
        <table class="summary">
          <thead><tr><th>Name</th><th>Hours</th><th>Earned</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="3" class="empty">No employees</td></tr>`}</tbody>
        </table>
      </div>`;
  }

  const emp = state.employees.find(e => e.employee_number === cr.empNum);
  if (!emp) return '';

  const allocation = computePaymentAllocation(cr.empNum);
  const inRangeAlloc = allocation.filter(a => inRange(a));
  const hoursTotal = inRangeAlloc.reduce((s, a) => s + Number(a.hours_worked || 0), 0);
  const earnedTotal = inRangeAlloc.reduce((s, a) => s + Number(a.amount_earned || 0), 0);
  const stillOwedTotal = inRangeAlloc.reduce((s, a) => s + a.owedAmt, 0);
  const paymentsInRange = state.payments.filter(p => p.employee_number === cr.empNum && p.payment_date >= cr.from && p.payment_date <= cr.to);
  const wagesPaidInRange = paymentsInRange.reduce((s, p) => s + paymentWages(p), 0);
  const gasPaidInRange = paymentsInRange.reduce((s, p) => s + paymentGas(p), 0);

  const statusColor = { Paid: 'var(--good)', Partial: '#B8860B', Unpaid: 'var(--bad)' };
  const entryRows = inRangeAlloc.map(a => `
    <tr style="${a.status !== 'Paid' ? 'background:#FFF6E9;' : ''}">
      <td>${fmtDate(a.work_date)}</td>
      <td>${Number(a.hours_worked) > 0 ? a.hours_worked : (a.notes || 'Job')}</td>
      <td>${money(a.amount_earned)}</td>
      <td style="color:${statusColor[a.status]}; font-weight:700;">${a.status}</td>
      <td>${a.owedAmt > 0 ? money(a.owedAmt) : '\u2014'}</td>
    </tr>`).join('');

  return `
    <div class="card" style="overflow-x:auto">
      <h2>Custom Report: ${escapeHtml(emp.name)}</h2>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;">${rangeLabel}</div>
      <table class="summary">
        <thead><tr><th>Date</th><th>Hours</th><th>Earned</th><th>Status</th><th>Still owed</th></tr></thead>
        <tbody>${entryRows || `<tr><td colspan="5" class="empty">No entries in this range</td></tr>`}</tbody>
      </table>
      <div class="entry" style="border-top:2px solid var(--ink); margin-top:8px; padding-top:10px;">
        <div><b>Total hours / earned this range</b></div><div class="amt">${hoursTotal} hrs &middot; ${money(earnedTotal)}</div>
      </div>
      <div class="entry"><div>Wages paid in this range</div><div class="amt">${money(wagesPaidInRange)}</div></div>
      <div class="entry"><div>Gas paid in this range</div><div class="amt">${money(gasPaidInRange)}</div></div>
      <div class="entry" style="border-top:2px solid var(--bad); margin-top:6px; padding-top:10px;">
        <div><b>Still owed for days in this range</b></div><div class="amt" style="color:var(--bad); font-size:17px;">${money(stillOwedTotal)}</div>
      </div>
    </div>`;
}

function renderAdminSummary(body) {
  const rows = state.employees.map(emp => {
    const t = totalsFor(emp.employee_number);
    return `<tr>
      <td>${escapeHtml(emp.name)}</td>
      <td>${money(t.earned)}</td>
      <td>${money(t.wagesPaid)}</td>
      <td><b>${money(t.wagesBalance)}</b></td>
      <td>${money(t.gasAccrued)}</td>
      <td>${money(t.gasPaid)}</td>
      <td><b>${money(t.gasBalance)}</b></td>
    </tr>`;
  }).join('');

  const wagesTotal = state.employees.reduce((s, e) => s + totalsFor(e.employee_number).earned, 0);
  const gasTotal = state.employees.reduce((s, e) => s + totalsFor(e.employee_number).gasAccrued, 0);

  const categories = ['Material', 'Labor', 'Contractor', 'Other'];
  const catRows = categories.map(cat => {
    const total = state.expenses.filter(x => x.category === cat).reduce((s, x) => s + Number(x.total || 0), 0);
    return `<tr><td>${cat}</td><td>${money(total)}</td></tr>`;
  }).join('');
  const expensesTotal = state.expenses.reduce((s, x) => s + Number(x.total || 0), 0);
  const grandTotal = expensesTotal + wagesTotal + gasTotal;

  const now = new Date();
  const generatedOn = `${now.getMonth() + 1}/${now.getDate()}/${now.getFullYear()}`;
  const cr = state.customReport;
  const crFromDefault = cr ? cr.from : (() => { const d = new Date(); d.setDate(d.getDate() - 6); return d.toISOString().slice(0, 10); })();
  const crToDefault = cr ? cr.to : todayStr();
  const crEmpDefault = cr ? cr.empNum : 'all';

  body.innerHTML = `
    <button class="secondary no-print" onclick="window.print()" style="margin-bottom:16px;">Print Report</button>

    <div class="card no-print">
      <h2>Custom Report</h2>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;">See wages/hours for one employee (or everyone) over a specific week or date range.</div>
      <label>Employee</label>
      <select id="cr_emp">
        <option value="all" ${crEmpDefault === 'all' ? 'selected' : ''}>All Employees</option>
        ${state.employees.map(e => `<option value="${e.employee_number}" ${crEmpDefault === e.employee_number ? 'selected' : ''}>${escapeHtml(e.name)}</option>`).join('')}
      </select>
      <div class="two-col">
        <div>
          <label>From</label>
          <input type="date" id="cr_from" value="${crFromDefault}">
        </div>
        <div>
          <label>To</label>
          <input type="date" id="cr_to" value="${crToDefault}">
        </div>
      </div>
      <button class="primary" onclick="generateCustomReport()">Generate Report</button>
      ${cr ? `<button class="secondary" onclick="clearCustomReport()">Clear</button>` : ''}
    </div>

    <div id="printable-report">
      <div class="print-only" style="display:none; margin-bottom:20px;">
        <h1 style="font-size:22px; margin-bottom:4px;">Construction Project Report</h1>
        <div style="color:#555; font-size:13px;">Generated ${generatedOn}</div>
      </div>

      ${cr ? renderCustomReportSection(cr) : ''}

      <div class="card" style="overflow-x:auto">
      <h2>All employees</h2>
      <table class="summary">
        <thead><tr><th>Name</th><th>Earned</th><th>Wages paid</th><th>Wages owed</th><th>Gas accrued</th><th>Gas paid</th><th>Gas owed</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7" class="empty">No employees yet</td></tr>`}</tbody>
      </table>
    </div>

    <div class="card" style="overflow-x:auto">
      <h2>Expenses by category</h2>
      <table class="summary">
        <thead><tr><th>Category</th><th>Total</th></tr></thead>
        <tbody>${catRows}<tr><td><b>Expense Log total</b></td><td><b>${money(expensesTotal)}</b></td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Total project cost</h2>
      <div class="entry"><div>Expense Log (materials, contractors, other)</div><div class="amt">${money(expensesTotal)}</div></div>
      <div class="entry"><div>Employee wages</div><div class="amt">${money(wagesTotal)}</div></div>
      <div class="entry"><div>Employee gas / gasolina</div><div class="amt">${money(gasTotal)}</div></div>
      <div class="entry" style="border-top:2px solid var(--ink); margin-top:4px; padding-top:12px;">
        <div><b>GRAND TOTAL</b></div><div class="amt" style="font-size:18px;">${money(grandTotal)}</div>
      </div>
    </div>
    </div>
  `;
}

/* ============================================================
   Utils
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso) {
  if (typeof iso !== 'string' || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso;
  const [y, m, d] = iso.slice(0, 10).split('-');
  return `${m}/${d}/${y.slice(2)}`;
}

const cached = loadCache();
if (cached) {
  state.employees = cached.employees || [];
  state.entries = cached.entries || [];
  state.payments = cached.payments || [];
  state.expenses = cached.expenses || [];
  paintCurrentView();  // instant paint from last known data while render() refreshes in the background
}
render();

// If the app was left open (phone locked, tab backgrounded, etc.) and the
// person comes back to it, quietly pull fresh data -- no button needed.
// render() already shows the existing view while it fetches in the
// background, so this doesn't cause any jarring "loading" flash.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !savePending) {
    render();
  }
});
</script>
